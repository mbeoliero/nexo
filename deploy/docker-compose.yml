# Three nexo nodes behind nginx + PG. `make compose-up` (builds nexo:dev once, then starts) adds
# docker-compose.redis.yml unless NEXO_COMPOSE_CONFIG=config.pg-only.yaml, which needs only PG.
# Ports: 18080 nginx, 18081-18083 loopback-only nodes (for kill / failover tests).
# Secrets never live in the committed configs: they arrive here from deploy/.env.
# `:?` makes compose refuse to start rather than silently run with a weak key.
x-env: &env
  NEXO_AUTH_NATIVE_SECRET: ${NEXO_AUTH_NATIVE_SECRET:?set it in deploy/.env, see deploy/.env.example}
  NEXO_DB_DSN: postgres://nexo:${NEXO_PG_PASSWORD:-nexo}@pg:5432/nexo?sslmode=disable

x-node: &node
  build: ..
  image: nexo:dev
  volumes:
    - ./${NEXO_COMPOSE_CONFIG:-config.yaml}:/etc/nexo/config.yaml:ro
  depends_on:
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped
  stop_grace_period: 20s

services:
  pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: ${NEXO_PG_PASSWORD:-nexo}
      POSTGRES_DB: nexo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo"]
      interval: 2s
      retries: 30
  migrate:
    build: ..
    image: nexo:dev
    command: ["migrate", "-config", "/etc/nexo/config.yaml"]
    environment: *env
    volumes:
      - ./${NEXO_COMPOSE_CONFIG:-config.yaml}:/etc/nexo/config.yaml:ro
    depends_on:
      pg:
        condition: service_healthy
    restart: "no"
  nexo1:
    <<: *node
    environment:
      <<: *env
      NEXO_NODE_ID: nexo1
    ports: ["127.0.0.1:18081:8080"]
  nexo2:
    <<: *node
    environment:
      <<: *env
      NEXO_NODE_ID: nexo2
    ports: ["127.0.0.1:18082:8080"]
  nexo3:
    <<: *node
    environment:
      <<: *env
      NEXO_NODE_ID: nexo3
    ports: ["127.0.0.1:18083:8080"]
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["18080:80"]
    depends_on: [nexo1, nexo2, nexo3]
