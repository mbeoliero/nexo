# Error logs can contain the raw request line, including tokens, regardless of access_log format.
# Deliberately discard ALL nginx error diagnostics; do not add overriding error_log/include directives.
error_log /dev/null;
events {}
http {
    # No query string in the log: GET /ws?token=<jwt> must never land in a file (AGENTS.md: tokens are not logged).
    log_format noquery '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $upstream_addr $request_time';
    access_log /dev/stdout noquery;
    # Native login / register run bcrypt; cap them per client here (limits.auth_per_ip_per_min in nexo is off by default).
    limit_req_zone $binary_remote_addr zone=nexo_auth:1m rate=10r/m;
    upstream nexo {
        server nexo1:8080;
        server nexo2:8080;
        server nexo3:8080;
    }
    server {
        listen 80;
        location ~ ^/api/v1/auth/(login|register)$ {
            limit_req zone=nexo_auth burst=10 nodelay;
            proxy_pass http://nexo;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location / {
            proxy_pass http://nexo;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            # nginx is the single trusted hop: overwrite, never append, so a client cannot forge the first entry
            # that the gateway uses for ws_conns_per_ip.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s; # a stopped node’s IP hangs on connect; fail over fast
            proxy_read_timeout 90s;   # above the 75s WS heartbeat window
            proxy_send_timeout 90s;
        }
    }
}
