# MySQL + Redis variant: `make image && docker compose -f deploy/docker-compose.mysql.yml up -d`.
# Ports: 18080 nginx, 18081-18083 loopback-only nodes (for kill / failover tests).
# Secrets never live in the committed configs: they arrive here from deploy/.env.
x-env: &env
  NEXO_AUTH_NATIVE_SECRET: ${NEXO_AUTH_NATIVE_SECRET:?set it in deploy/.env, see deploy/.env.example}
  NEXO_DB_DSN: root:${NEXO_MYSQL_PASSWORD:-nexo}@tcp(mysql:3306)/nexo?parseTime=true&loc=UTC

x-node: &node
  build: ..
  image: nexo:dev
  volumes:
    - ./config.mysql.yaml:/etc/nexo/config.yaml:ro
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  restart: unless-stopped
  stop_grace_period: 20s

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${NEXO_MYSQL_PASSWORD:-nexo}
      MYSQL_DATABASE: nexo
    healthcheck:
      # The entrypoint's temporary --skip-networking server answers socket pings before initialization finishes.
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 --protocol=TCP -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 3s
      retries: 60
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30
  migrate:
    build: ..
    image: nexo:dev
    command: ["migrate", "-config", "/etc/nexo/config.yaml"]
    environment: *env
    volumes:
      - ./config.mysql.yaml:/etc/nexo/config.yaml:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
  nexo1:
    <<: *node
    environment:
      <<: *env
      NEXO_NODE_ID: nexo1
    ports: ["127.0.0.1:18081:8080"]
  nexo2:
    <<: *node
    environment:
      <<: *env
      NEXO_NODE_ID: nexo2
    ports: ["127.0.0.1:18082:8080"]
  nexo3:
    <<: *node
    environment:
      <<: *env
      NEXO_NODE_ID: nexo3
    ports: ["127.0.0.1:18083:8080"]
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["18080:80"]
    depends_on: [nexo1, nexo2, nexo3]
